server:
  port: 8080
spring:
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: e47b1dcd-878d-4721-b51f-8747f086c88c
        username: nacos
        password: nacos
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # 业务服务路由
        - id: sea-auth
          uri: lb://sea-auth
          order: 1
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=2
        - id: sea-media
          uri: lb://sea-media
          order: 3
          predicates:
            - Path=/api/media/**
          filters:
            - StripPrefix=2
        - id: sea-system
          uri: lb://sea-system
          order: 2
          predicates:
            - Path=/api/system/**
          filters:
            - StripPrefix=2
        - id: sea-code
          uri: lb://sea-code
          order: 4
          predicates:
            - Path=/api/code/**
          filters:
            - StripPrefix=2

        # SpringDoc API文档路由
        - id: sea-auth-docs
          uri: lb://sea-auth
          order: 10
          predicates:
            - Path=/sea-auth/v3/api-docs/**
          filters:
            - StripPrefix=1
        - id: sea-system-docs
          uri: lb://sea-system
          order: 11
          predicates:
            - Path=/sea-system/v3/api-docs/**
          filters:
            - StripPrefix=1
        - id: sea-media-docs
          uri: lb://sea-media
          order: 12
          predicates:
            - Path=/sea-media/v3/api-docs/**
          filters:
            - StripPrefix=1
        - id: sea-code-docs
          uri: lb://sea-code
          order: 13
          predicates:
            - Path=/sea-code/v3/api-docs/**
          filters:
            - StripPrefix=1

# SpringDoc 网关聚合配置
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: 认证服务
        url: sea-auth/v3/api-docs
      - name: 系统服务
        url: sea-system/v3/api-docs
      - name: 媒体服务
        url: sea-media/v3/api-docs
      - name: 代码生成服务
        url: sea-code/v3/api-docs
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  webjars:
    prefix: /webjars
