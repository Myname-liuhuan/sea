# sea-notification 在 Nacos 上的 Data ID 配置样例（运维拷到 Nacos）
# Data ID:  sea-notification.yaml
# Group:     DEFAULT_GROUP

server:
  port: 8085

spring:
  application:
    name: sea-notification
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/sea_notification?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  mail:
    host: smtp.example.com
    port: 465
    username: noreply@example.com
    # 凭据留空避免 Spring 解析 ${MAIL_PASSWORD} 失败。
    # 实际密码请运维在 Nacos 控制台直接填值（不要再用 ${VAR} 占位符语法，Nacos 不做服务端解析）。
    password: ""
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848

# 阿里云短信
# 凭据留空避免 Spring 解析 ${ALI_SMS_AK/SK} 失败。
# 实际 AK/SK 请运维在 Nacos 控制台直接填值。
aliyun:
  sms:
    access-key-id: ""
    access-key-secret: ""
    sign-name: 海纳系统
    endpoint: dysmsapi.aliyuncs.com
    template-code: SMS_2600100

# WebSocket（强制走网关路径）
websocket:
  endpoint: /api/notification/ws/notify
  allowed-origins: "*"

# 通知重试 job
notify:
  retry:
    max-attempts: 3
    cron: "0 * * * * ?"
  # 三通道总开关（@RefreshScope 热切，无需重启）
  # sms 默认 false，等 vendor 凭据到位再在 Nacos 上改成 true
  channel:
    sms:
      enabled: false
    email:
      enabled: true
    inapp:
      enabled: true

logging:
  level:
    com.aliyun: warn

# SpringDoc 扫描配置（与 sea-system.yaml / sea-workflow.yaml 同套路）
# 没这一段 sea-notification 的 /v3/api-docs 会扫不到 controller
springdoc:
  packages-to-scan: com.example.sea.notification