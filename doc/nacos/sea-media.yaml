server:
  port: 8082

spring:
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
      file-size-threshold: 10MB
  web:
    resources:
      add-mappings: false # 关闭Spring Boot默认的静态资源映射
  # 数据源配置
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/sea?useUnicode=true&characterEncoding=utf-8&useSSL=true&serverTimezone=GMT%2B8
    username: root
    password: lh123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath*:/mappers/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

# SpringDoc 服务特定配置
springdoc:
  packages-to-scan: com.example.sea.media

#本地文件存储配置
sea:
  oss:
    enabled: true
    endpoint: http://localhost:9000                    # MinIO 服务地址
    access-key-id: admin                         # MinIO 用户名
    secret-access-key: 12345678                     # MinIO 密码
    bucket-name: sea-media                            # 存储桶名称（需要提前创建）
    region: us-east-1                                 # 区域（MinIO 可不设置或设为 us-east-1）
    path-style-access: true                           # Path-Style 访问（MinIO 必须启用）
    connection-timeout: 10000                         # 连接超时（毫秒）
    read-timeout: 60000                               # 读取超时（毫秒）
    write-timeout: 60000                              # 写入超时（毫秒）
    max-connections: 50                               # 最大连接数