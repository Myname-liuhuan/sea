server:
  port: 8080
spring:
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: e47b1dcd-878d-4721-b51f-8747f086c88c
        username: nacos
        password: nacos
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # 业务服务路由
        - id: sea-auth
          uri: lb://sea-auth
          order: 1
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1
        - id: sea-media
          uri: lb://sea-media
          order: 3
          predicates:
            - Path=/media/**
          filters:
            - StripPrefix=1
        - id: sea-system
          uri: lb://sea-system
          order: 2
          predicates:
            - Path=/system/**
          filters:
            - StripPrefix=1
        - id: sea-code
          uri: lb://sea-code
          order: 4
          predicates:
            - Path=/code/**
          filters:
            - StripPrefix=1

        # 工作流：与 sea-system 等保持一致（gateway strip + 控制器无 service-name 前缀）。
        # 前端 baseURL=/api 经 Vite 抹掉后到网关是 /workflow/...，匹配本条。
        - id: sea-workflow
          uri: lb://sea-workflow
          order: 5
          predicates:
            - Path=/workflow/**
          filters:
            - StripPrefix=1

        # 通知服务 HTTP API：跟 workflow 同样的 gateway-strip 模式。
        - id: sea-notification
          uri: lb://sea-notification
          order: 6
          predicates:
            - Path=/notification/**
          filters:
            - StripPrefix=1

        # 通知服务 WebSocket：Vite 不代理 WS（前端用 VITE_WS_BASE_URL 直连网关），
        # 所以 URL 仍带 /api 前缀，需独立一条不放 strip 的路由。
        # 配 shared_bootstrap.yaml 的白名单 /api/notification/ws/** 一起放过 AuthFilter。
        - id: sea-notification-ws
          uri: lb://sea-notification
          order: 7
          predicates:
            - Path=/api/notification/ws/**

        # SpringDoc API文档路由
        - id: sea-auth-docs
          uri: lb://sea-auth
          order: 10
          predicates:
            - Path=/sea-auth/v3/api-docs/**
          filters:
            - StripPrefix=1
        - id: sea-system-docs
          uri: lb://sea-system
          order: 11
          predicates:
            - Path=/sea-system/v3/api-docs/**
          filters:
            - StripPrefix=1
        - id: sea-media-docs
          uri: lb://sea-media
          order: 12
          predicates:
            - Path=/sea-media/v3/api-docs/**
          filters:
            - StripPrefix=1
        - id: sea-code-docs
          uri: lb://sea-code
          order: 13
          predicates:
            - Path=/sea-code/v3/api-docs/**
          filters:
            - StripPrefix=1
        - id: sea-workflow-docs
          uri: lb://sea-workflow
          order: 14
          predicates:
            - Path=/sea-workflow/v3/api-docs/**

        # 通知服务 OpenAPI 文档
        - id: sea-notification-docs
          uri: lb://sea-notification
          order: 15
          predicates:
            - Path=/sea-notification/v3/api-docs/**
          filters:
            - StripPrefix=1

# SpringDoc 网关聚合配置
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: 认证服务
        url: sea-auth/v3/api-docs
      - name: 系统服务
        url: sea-system/v3/api-docs
      - name: 媒体服务
        url: sea-media/v3/api-docs
      - name: 代码生成服务
        url: sea-code/v3/api-docs
      - name: 工作流服务
        url: sea-workflow/v3/api-docs
      - name: 通知服务
        url: sea-notification/v3/api-docs
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  webjars:
    prefix: /webjars
