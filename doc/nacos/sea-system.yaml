server:
  port: 8083

spring:
  web:
    resources:
      add-mappings: false # 关闭Spring Boot默认的静态资源映射
  # 数据源配置
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/sea_system?useUnicode=true&characterEncoding=utf-8&useSSL=true&serverTimezone=GMT%2B8
    username: root
    password: lh123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath*:/mappers/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

# SpringDoc 服务特定配置
springdoc:
  packages-to-scan: com.example.sea.system
